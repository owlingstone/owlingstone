# Facts about the current Battlegrounds season that change with patches. Edit after a patch; the app
# reloads this file when it changes.
#
#   lobby_tribes  number of tribes in each lobby (5 in Season 14)
#   rotated_out   tribes taken out of the pool while HearthstoneJSON still marks their minions as "pool"
